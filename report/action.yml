name: "field-cage report"
description: "Render a field-cage agent log as a GitHub Actions job summary and annotations."
branding:
  icon: "shield"
  color: "blue"

inputs:
  version:
    description: "Release tag of field-cage to download (e.g. v0.1.0). Pin this to match the main action's `version` input."
    required: true
  log-file:
    description: "Path to the agent log. Defaults to the FC_LOG environment variable set by the main `takihito/field-cage` action."
    required: false
    default: ""
  summary:
    description: "Write a Markdown report to the job summary."
    required: false
    default: "true"
  annotations:
    description: "Annotation level for denied connections: auto, off, notice, warning, or error. auto uses warning in block mode and notice in audit mode."
    required: false
    default: "auto"
  fail-on-deny:
    description: "Fail this step if any connection was denied. Leave false for audit-mode jobs, where a denial is informational."
    required: false
    default: "false"
  upload-log:
    description: "Upload the raw agent log as a workflow artifact."
    required: false
    default: "false"
  top:
    description: "Maximum destinations shown per table (0 for unlimited)."
    required: false
    default: "50"

outputs:
  denied-count:
    description: "Number of denied connection events."
    value: ${{ steps.render.outputs.denied-count }}
  allowed-count:
    description: "Number of allowed connection events."
    value: ${{ steps.render.outputs.allowed-count }}
  suggested-allowlist:
    description: "JSON array of destinations observed in the log, excluding DNS/loopback skips. Review before using as a policy."
    value: ${{ steps.render.outputs.suggested-allowlist }}

runs:
  using: composite
  steps:
    - name: Resolve field-cage binary
      shell: bash
      env:
        FC_VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        # Reuse the binary the main action already verified and downloaded
        # (FC_BIN in the job environment) when this step runs in the same job
        # right after it. Otherwise download and verify our own copy so this
        # action also works standalone.
        if [ -n "${FC_BIN:-}" ] && [ -x "${FC_BIN}" ]; then
          echo "field-cage: reusing already-verified binary at ${FC_BIN}"
          exit 0
        fi

        case "$(uname -m)" in
          x86_64)  ARCH=amd64 ;;
          aarch64) ARCH=arm64 ;;
          *) echo "field-cage: unsupported architecture: $(uname -m)" >&2; exit 1 ;;
        esac
        bin="field-cage_linux_${ARCH}"
        base="https://github.com/takihito/field-cage/releases/download/${FC_VERSION}"
        tmp="$(mktemp -d -p "${RUNNER_TEMP:-/tmp}")"

        echo "field-cage: downloading checksums (${FC_VERSION})"
        curl -fsSL "${base}/checksums.txt"        -o "${tmp}/checksums.txt"
        curl -fsSL "${base}/checksums.txt.bundle" -o "${tmp}/checksums.txt.bundle"

        echo "field-cage: verifying cosign signature on checksums.txt"
        command -v cosign >/dev/null 2>&1 || {
          echo "::error::cosign is not installed. Add the sigstore/cosign-installer step, or run this action right after the main takihito/field-cage step in the same job." >&2
          exit 1
        }
        cosign verify-blob \
          --bundle "${tmp}/checksums.txt.bundle" \
          --certificate-identity "https://github.com/takihito/field-cage/.github/workflows/release.yml@refs/tags/${FC_VERSION}" \
          --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
          "${tmp}/checksums.txt"

        echo "field-cage: downloading ${bin} (${FC_VERSION})"
        curl -fsSL "${base}/${bin}" -o "${tmp}/${bin}"
        ( cd "${tmp}" && grep " ${bin}\$" checksums.txt | sha256sum -c - )
        chmod +x "${tmp}/${bin}"
        echo "FC_BIN=${tmp}/${bin}" >> "$GITHUB_ENV"

    - name: Render report
      id: render
      shell: bash
      env:
        FC_LOG_INPUT: ${{ inputs.log-file }}
        FC_SUMMARY: ${{ inputs.summary }}
        FC_ANNOTATIONS: ${{ inputs.annotations }}
        FC_FAIL_ON_DENY: ${{ inputs.fail-on-deny }}
        FC_TOP: ${{ inputs.top }}
      run: |
        set -euo pipefail

        log_file="${FC_LOG_INPUT:-${FC_LOG:-/tmp/field-cage.log}}"
        if [ ! -f "${log_file}" ]; then
          echo "::error::field-cage report: log file not found: ${log_file}" >&2
          echo "::error::Did the main takihito/field-cage step run earlier in this job, and does log-file match its log-file input?" >&2
          exit 1
        fi

        mode_flag=()
        if [ -n "${FC_MODE:-}" ]; then mode_flag=(--mode "${FC_MODE}"); fi

        echo "::group::field-cage raw log"
        cat "${log_file}"
        echo "::endgroup::"

        if [ "${FC_SUMMARY}" = "true" ]; then
          "${FC_BIN}" report --log "${log_file}" --format markdown --top "${FC_TOP}" "${mode_flag[@]}" >> "$GITHUB_STEP_SUMMARY"
        fi

        if [ "${FC_ANNOTATIONS}" != "off" ]; then
          "${FC_BIN}" report --log "${log_file}" --format annotations --annotation-level "${FC_ANNOTATIONS}" --top "${FC_TOP}" "${mode_flag[@]}"
        fi

        json="$("${FC_BIN}" report --log "${log_file}" --format json --top 0 "${mode_flag[@]}")"
        denied_count="$(printf '%s' "${json}" | jq '[.by_verdict | to_entries[] | select(.key | startswith("DENY")) | .value] | add // 0')"
        allowed_count="$(printf '%s' "${json}" | jq '.by_verdict["ALLOW"] // 0')"
        suggested="$(printf '%s' "${json}" | jq -c '.suggested_allowlist')"

        {
          echo "denied-count=${denied_count}"
          echo "allowed-count=${allowed_count}"
          echo "suggested-allowlist=${suggested}"
        } >> "$GITHUB_OUTPUT"

        if [ "${FC_FAIL_ON_DENY}" = "true" ] && [ "${denied_count}" -gt 0 ]; then
          echo "::error title=field-cage::${denied_count} outbound connection(s) were denied." >&2
          exit 1
        fi

    - name: Upload field-cage log
      if: ${{ inputs.upload-log == 'true' }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: field-cage-log
        path: ${{ inputs.log-file != '' && inputs.log-file || '/tmp/field-cage.log' }}
        if-no-files-found: warn
