name: "field-cage stop"
description: "Stop the field-cage agent started by the main takihito/field-cage action."
branding:
  icon: "shield"
  color: "blue"

runs:
  using: composite
  steps:
    - name: Stop field-cage agent
      shell: bash
      run: |
        set -euo pipefail

        # This sub-action can run standalone (no main takihito/field-cage step
        # in this job) or after the agent was already stopped by an earlier
        # `report` step (stop-agent defaults to true there); both are no-ops,
        # not errors.
        if [ -z "${FC_PID:-}" ]; then
          echo "::warning title=field-cage::No running agent found (FC_PID is not set) — nothing to stop." >&2
          exit 0
        fi
        if ! sudo kill -0 "${FC_PID}" 2>/dev/null; then
          echo "field-cage: agent (pid=${FC_PID}) is already stopped."
          exit 0
        fi

        # In block mode, the agent enforces a cgroup-wide eBPF hook that also
        # covers the runner's own process — including the connections it
        # opens to report job status as the job wraps up. Composite actions
        # have no automatic post-job step, so nothing stops the agent unless
        # this step (or `report`'s default stop-agent behavior) runs; left
        # running, it can end up blocking the runner's own traffic and make
        # the job appear to hang rather than fail cleanly.
        echo "field-cage: stopping agent (pid=${FC_PID})"
        sudo kill -TERM "${FC_PID}" 2>/dev/null || true

        # SIGTERM lets the agent close its eBPF links itself and log a clean
        # shutdown line. The links are not pinned to bpffs, so even if this
        # graceful path fails and SIGKILL below is needed instead, the kernel
        # still detaches them (and lifts enforcement) once the process's file
        # descriptors are torn down on exit — SIGKILL is a safety net, not a
        # weaker fallback.
        stopped=false
        for _ in $(seq 1 10); do
          if ! sudo kill -0 "${FC_PID}" 2>/dev/null; then
            stopped=true
            break
          fi
          sleep 1
        done

        if [ "${stopped}" = true ]; then
          echo "field-cage: agent stopped."
          exit 0
        fi

        echo "::warning title=field-cage::Agent (pid=${FC_PID}) did not stop within 10s of SIGTERM; sending SIGKILL." >&2
        sudo kill -KILL "${FC_PID}" 2>/dev/null || true
        sleep 1
        if sudo kill -0 "${FC_PID}" 2>/dev/null; then
          echo "::error title=field-cage::Failed to stop agent (pid=${FC_PID}) even after SIGKILL. In block mode, enforcement may still be active for the rest of this job." >&2
          exit 1
        fi
        echo "field-cage: agent force-stopped."
