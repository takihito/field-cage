name: Smoke Test

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------
  # Smoke test: build the binary, run it, generate real outbound
  # traffic, and verify the connection log appears in CI output.
  # ---------------------------------------------------------------
  smoke-test:
    name: Smoke test (connection logging)
    runs-on: ubuntu-latest

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v6
        with:
          go-version-file: go.mod
          cache: true

      # NOTE: this job builds field-cage from source, so the steps below
      # (apt-get, go install) fetch the tool's own build dependencies before
      # its binary exists — field-cage cannot monitor the network calls that
      # build it. A Harden Runner audit log on this job will show
      # proxy.golang.org / apt mirror traffic that never appears in
      # field-cage's own log; that's expected, not a detection gap. See the
      # "Monitoring window" note in docs/github-actions.md.
      - name: Install eBPF build dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends clang llvm libbpf-dev
          sudo apt-get install -y --no-install-recommends "linux-headers-$(uname -r)"
          ARCH=$(uname -m)
          case $ARCH in
            x86_64)  TRIPLET=x86_64-linux-gnu ;;
            aarch64) TRIPLET=aarch64-linux-gnu ;;
            *) echo "Unsupported architecture: $ARCH" >&2; exit 1 ;;
          esac
          sudo ln -sf "/usr/include/${TRIPLET}/asm" /usr/include/asm

      - name: Install bpf2go
        run: |
          EBPF_VERSION=$(go list -m -f '{{.Version}}' github.com/cilium/ebpf)
          go install github.com/cilium/ebpf/cmd/bpf2go@${EBPF_VERSION}

      - name: Generate eBPF bindings
        run: go generate ./internal/ebpf/...

      - name: Build field-cage binary
        run: CGO_ENABLED=0 GOOS=linux go build -trimpath -o /tmp/field-cage ./cmd/agent

      - name: Start field-cage agent
        run: |
          sudo /tmp/field-cage > /tmp/fc-log.txt 2>&1 &
          sleep 2

      - name: Generate outbound traffic
        run: |
          curl -4 -s https://github.com    -o /dev/null
          curl -4 -s https://example.com   -o /dev/null
          curl -4 -s https://api.github.com -o /dev/null
          sleep 1

      - name: Show field-cage connection log
        if: always()
        run: |
          echo "=== field-cage captured connections ==="
          cat /tmp/fc-log.txt 2>/dev/null || echo "(log file not found — agent may have failed to start)"
          echo "======================================="
          LINES=$(grep -c "dst=" /tmp/fc-log.txt 2>/dev/null || echo 0)
          echo "Total connection events: ${LINES}"

      - name: Render connection report
        if: always()
        run: |
          if [ -f /tmp/fc-log.txt ]; then
            /tmp/field-cage report --log /tmp/fc-log.txt --format markdown >> "$GITHUB_STEP_SUMMARY"
            /tmp/field-cage report --log /tmp/fc-log.txt --format annotations
          fi
          echo "::notice title=field-cage::This job builds field-cage from source, so it only monitors traffic from after the agent starts (the 'Start field-cage agent' step). Earlier build-dependency traffic (apt, go install) is outside its window and may still appear in a Harden Runner audit log — that is expected, not a detection gap."

      - name: Verify at least one connection was captured
        run: |
          if ! grep -q "dst=" /tmp/fc-log.txt 2>/dev/null; then
            echo "ERROR: no connection events captured" >&2
            exit 1
          fi

      - name: Stop field-cage agent
        if: always()
        run: sudo pkill -f /tmp/field-cage || true
