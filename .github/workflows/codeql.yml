name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 3 * * 1" # Every Monday at 03:00 UTC

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (Go)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # required by codeql-action/analyze to upload results

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Initialize CodeQL
        uses: github/codeql-action/init@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          languages: go
          queries: security-extended

      - name: Install eBPF build dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends clang llvm libbpf-dev
          sudo apt-get install -y --no-install-recommends "linux-headers-$(uname -r)"
          ARCH=$(uname -m)
          case $ARCH in
            x86_64)  TRIPLET=x86_64-linux-gnu ;;
            aarch64) TRIPLET=aarch64-linux-gnu ;;
          esac
          sudo ln -sf /usr/include/${TRIPLET}/asm /usr/include/asm

      - name: Install bpf2go
        run: |
          EBPF_VERSION=$(go list -m -f '{{.Version}}' github.com/cilium/ebpf)
          go install github.com/cilium/ebpf/cmd/bpf2go@${EBPF_VERSION}

      - name: Generate eBPF bindings
        run: go generate ./internal/ebpf/...

      - name: Build
        run: go build ./...

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          category: "/language:go"
